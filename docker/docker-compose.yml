# ============================================================
# 林卡电表统计 — Docker Compose
# ============================================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 日志:  docker compose logs -f
# 重启:  docker compose restart
# ============================================================

services:
  linclub:
    build: .
    container_name: linclub
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 数据持久化（使用宿主机目录 ./data，重启容器数据不丢失）
      # ⚠️ 首次运行会自动创建 ./data 目录
      - ./data:/data
      # 时区设置（同步宿主机时区）
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      # 时区（北京时间 UTC+8）
      - TZ=Asia/Shanghai
      # 端口配置（默认 8765）
      - LINCLUB_PORT=8765
      # 数据目录（默认 /data）
      - LINCLUB_DATA_DIR=/data
      # 绑定地址（默认 0.0.0.0，容器内用 0.0.0.0）
      - LINCLUB_BIND=0.0.0.0
      # 初始管理员密码（请修改！默认 admin123）
      - LINCLUB_INITIAL_PASS=admin123
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3) or exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# 不再需要命名卷，数据存储在 ./data 目录（宿主机上的持久化目录）
# 确保 ./data 目录存在: mkdir -p ./data && docker compose up -d
