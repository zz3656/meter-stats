# ============================================================
# 电表统计 — Docker Compose
# ============================================================
# 镜像: zz3656/meter-stats:latest
# 访问: http://localhost:8765
# 默认: admin / admin123
# 启动: docker compose up -d
# 停止: docker compose down
#
# 🔄 升级: docker compose pull && docker compose up -d
#    ⚠️ Docker 从不主动检查远端仓库:本地已有镜像时 `up -d` 既不提示也不拉取,
#       必须显式 pull。想省事可用仓库里的脚本:bash scripts/docker-update.sh
#    (若你的环境是 Compose v2,还可以取消下面 pull_policy 的注释,
#     以后 `up -d` 就会每次自动检查并更新;Compose v1 不支持该选项,
#     打开会导致容器启动报 Unsupported config option)
# ============================================================

services:
  meter-stats:
    image: zz3656/meter-stats:latest
    # pull_policy: always   # 需 Compose v2;打开后 `up -d` 会自动检查并拉取新镜像
    container_name: meter-stats
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 数据持久化（使用宿主机目录，重启容器数据不丢失）
      - ./data:/data
    environment:
      # 时区（POSIX 标准 TZ 环境变量，默认 Asia/Shanghai）
      - TZ=Asia/Shanghai
      # 服务端口（默认 8765）
      - METER_PORT=8765
      # 数据目录
      - METER_DATA_DIR=/data
      # 绑定地址（0.0.0.0 允许外部访问，默认值已在代码中设置）
      - METER_BIND=0.0.0.0
      # 初始管理员密码（⚠️ 请修改！）
      - METER_INITIAL_PASS=admin123
      # 标记 Docker 环境（禁用 UI 修改备份目录；entrypoint.sh 也通过 /.dockerenv 自动检测）
      - METER_DOCKER=1
      # 备份目录（相对于 /data 的相对路径，留空则使用 /data/backup）
      # - METER_BACKUP_DIR=backup
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
