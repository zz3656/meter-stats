[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "meter-stats"
description = "场所工程部电表数据管理工具"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []  # 零外部依赖
dynamic = ["version"]

[project.scripts]
meter-stats = "server:main"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "SIM"]
ignore = ["E501"]  # line-too-long handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["storage", "server", "app_handler", "routing", "report"]

[tool.mypy]
python_version = "3.9"
strict = true
