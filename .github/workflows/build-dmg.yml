name: Build DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarization:
        description: 'Enable notarization'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build DMG
    runs-on: macos-latest
    env:
      APP_NAME: "MeterStats"
      BUNDLE_ID: "com.meter.stats"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=$(python3 -c "import plistlib; p=plistlib.load(open('MeterStats/Info.plist','rb')); print(p['CFBundleShortVersionString'])")
          else
            VERSION=$(python3 -c "import plistlib; p=plistlib.load(open('MeterStats/Info.plist','rb')); print(p['CFBundleShortVersionString'])")
          fi
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcode-select -p

      # ── 构建 .app ──────────────────────────────────────────
      # swift build 只产出裸可执行文件 + bundle，不生成 .app，
      # 这里手动组装标准 macOS 应用包（Info.plist / MacOS / Resources）。
      - name: Build with Swift Package Manager
        run: |
          # VERSION 参与资源打包，缺失时用 Info.plist 中的版本生成
          if [ ! -f MeterStats/VERSION ]; then
            echo "${VERSION}" > MeterStats/VERSION
          fi
          # 清理 Python 缓存，避免被打进资源 bundle
          find MeterStats -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          # 构建通用二进制(arm64 + x86_64),Intel 与 Apple Silicon 都能运行;
          # 若交叉编译失败则回退为宿主架构
          swift build -c release --arch arm64 --arch x86_64 || swift build -c release

          APP_PATH="products/${APP_NAME}.app"
          rm -rf "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/Resources"

          # 可执行文件(多架构构建在 apple/Products/Release/,单架构在 arm64-apple-macosx/release/)
          BIN=$(find .build -type f -path "*/Products/Release/${APP_NAME}" -perm -111 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find .build -type f -path "*/release/${APP_NAME}" -perm -111 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "❌ 找不到编译产物 ${APP_NAME}，可用产物："
            find .build -name "${APP_NAME}" -type f 2>/dev/null
            exit 1
          fi
          echo "✅ 编译产物: $BIN"
          file "$BIN"
          cp "$BIN" "$APP_PATH/Contents/MacOS/${APP_NAME}"

          # 资源（Python 后端 + 前端 + VERSION）
          BUNDLE_DIR=$(find .build -type d -name "*.bundle" 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "❌ 找不到资源 bundle"
            exit 1
          fi
          # 兼容两种 bundle 布局:
          #   单架构构建: bundle/index.html(扁平)
          #   universal 构建: bundle/Contents/Resources/index.html(嵌套)
          RES_SRC="$BUNDLE_DIR"
          if [ -d "$BUNDLE_DIR/Contents/Resources" ]; then
            RES_SRC="$BUNDLE_DIR/Contents/Resources"
          fi
          echo "✅ 资源源目录: $RES_SRC"
          ls "$RES_SRC" | head -5
          cp -R "$RES_SRC/." "$APP_PATH/Contents/Resources/"

          # Info.plist（CFBundleExecutable 指向实际二进制）
          cp MeterStats/Info.plist "$APP_PATH/Contents/Info.plist"
          python3 - <<'PYEOF'
          import plistlib
          info_path = "products/MeterStats.app/Contents/Info.plist"
          with open(info_path, "rb") as f:
              info = plistlib.load(f)
          info["CFBundleExecutable"] = "MeterStats"
          with open(info_path, "wb") as f:
              plistlib.dump(info, f, sort_keys=False)
          PYEOF

          echo "✅ 已组装 .app: $APP_PATH"
          find "$APP_PATH" -type f | head -20

      # ── 准备图标 ───────────────────────────────────────────
      - name: Embed AppIcon.icns in .app bundle
        run: |
          APP="products/${APP_NAME}.app/Contents/Resources"
          mkdir -p "$APP"
          
          # 确保 AppIcon.icns 在 Resources 中
          cp Assets/AppIcon.icns "$APP/AppIcon.icns"
          
          # 更新 Info.plist 的 CFBundleIconFile
          python3 << 'PYEOF'
          import plistlib, sys

          info_path = "products/MeterStats.app/Contents/Info.plist"
          with open(info_path, "rb") as f:
              info = plistlib.load(f)

          info["CFBundleIconFile"] = "AppIcon"
          info["CFBundleIconName"] = "AppIcon"

          with open(info_path, "wb") as f:
              plistlib.dump(info, f, sort_keys=False)

          print("✅ Info.plist 已更新")
          print(f"   CFBundleIconFile = {info.get('CFBundleIconFile')}")
          PYEOF

      # ── 临时签名(ad-hoc) ───────────────────────────────────
      # 未配置 Apple Developer ID 时,给 app 加本地 ad-hoc 签名,
      # 避免未签名应用被 Gatekeeper 判为"已损坏,无法打开"。
      # 有 Developer ID 时后面的正式签名会覆盖此签名。
      - name: Ad-hoc sign app
        run: |
          APP="products/${APP_NAME}.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 已生成 ad-hoc 签名(无 Developer ID 时的本地签名)"

      # ── 代码签名 ───────────────────────────────────────────
      - name: Install Apple Developer Certificate
        if: github.event.inputs.notarization == 'true' || startsWith(github.ref, 'refs/tags/')
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD || 'keychain-password' }}
        run: |
          # 创建并解锁 keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          # 导入证书
          echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          rm certificate.p12

          # 验证
          echo "已导入的签名身份："
          security find-identity -v -p codesigning build.keychain

      - name: Sign app (Developer ID)
        if: github.event.inputs.notarization == 'true' || startsWith(github.ref, 'refs/tags/')
        env:
          TEAM_NAME: ${{ secrets.APPLE_DEVELOPER_ID_TEAM_NAME }}
        run: |
          APP="products/${APP_NAME}.app"
          SIGN_ID="Developer ID Application: $TEAM_NAME"
          
          echo "🔐 签名应用..."
          codesign --verbose=4 \
            --sign "$SIGN_ID" \
            --options runtime \
            --timestamp \
            --entitlements "MeterStats/Linclub.entitlements" \
            "$APP"
          
          # 验证签名链
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 签名验证通过"

      # ── 创建 DMG ───────────────────────────────────────────
      - name: Create DMG
        run: |
          APP="products/${APP_NAME}.app"
          DMG_NAME="${APP_NAME}-${{ env.version }}-macos.dmg"
          
          # 创建临时挂载点
          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          
          # 把 .app 拷贝到 staging
          cp -r "$APP" "$STAGING/"
          
          # 创建应用链接文件夹 (.app 的快捷方式)
          ln -s /Applications "$STAGING/Applications"
          
          # 创建 DMG
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            -imagekey zlib-level=9 \
            "$STAGING/$DMG_NAME"
          
          # 复制到 products 目录
          mv "$STAGING/$DMG_NAME" "products/$DMG_NAME"
          
          # 清理
          rm -rf "$STAGING"
          
          echo "✅ DMG 已创建: products/$DMG_NAME"
          ls -lh "products/$DMG_NAME"

      # ── 公证 (Notarization) ────────────────────────────────
      - name: Notarize DMG
        if: (github.event.inputs.notarization == 'true' || startsWith(github.ref, 'refs/tags/'))
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          DMG="products/${APP_NAME}-${{ env.version }}-macos.dmg"

          echo "📤 提交公证..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          echo "✅ 公证成功!"

      - name: Staple notarization ticket
        if: (github.event.inputs.notarization == 'true' || startsWith(github.ref, 'refs/tags/'))
        run: |
          APP="products/${APP_NAME}.app"
          DMG="products/${APP_NAME}-${{ env.version }}-macos.dmg"
          
          echo "📌 附加票据到应用..."
          xcrun stapler staple "$APP" 2>&1 || echo "⚠️ 票据附加失败（可能尚未公证完成）"
          
          echo "📌 附加票据到 DMG..."
          xcrun stapler staple "$DMG" 2>&1 || echo "⚠️ 票据附加失败（可能尚未公证完成）"

      # ── 验证 ───────────────────────────────────────────────
      - name: Verify DMG
        run: |
          echo "📦 products 目录内容："
          ls -lh products/
          
          # 验证 app 签名
          codesign --verify --deep --strict --verbose=2 "products/${APP_NAME}.app" || echo "⚠️ 签名验证有警告"
          
          # 验证 app 在 DMG 中也能签名通过
          hdiutil attach "products/${APP_NAME}-${{ env.version }}-macos.dmg" -readonly -noverify -nobrowse -mountpoint /tmp/mnt
          codesign --verify --deep --strict --verbose=2 "/tmp/mnt/${APP_NAME}.app" || echo "⚠️ DMG 内签名验证有警告"
          hdiutil detach /tmp/mnt -force

      # ── 上传产物 ───────────────────────────────────────────
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${APP_NAME}-${{ env.version }}"
          path: |
            products/*.dmg
          retention-days: 30

      # ── 发布 Release ───────────────────────────────────────
      # 每次 DMG 构建成功都自动发布 GitHub Release(手动触发或打 tag 均可)。
      # tag 统一为 v{VERSION}(手动触发时取自 Info.plist,打 tag 时即触发 tag)。
      # 同版本已存在则删除重建,支持重跑。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          TAG="v${VERSION}"
          echo "==> 发布 Release: $TAG (commit ${SHA:0:7})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Release $TAG 已存在,删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          # 拉取完整历史 + tags,用于生成更新说明
          git fetch --prune --unshallow --tags origin 2>/dev/null || git fetch --tags origin 2>/dev/null || true

          NOTES=$(python3 << 'PYEOF'
          import re, subprocess

          version = __import__("os").environ["VERSION"]
          prev_tag = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "HEAD~1"],
              capture_output=True, text=True).stdout.strip()
          if not prev_tag:
              prev_tag = subprocess.run(
                  ["git", "rev-list", "--max-parents=0", "HEAD"],
                  capture_output=True, text=True).stdout.strip()

          rng = f"{prev_tag}..HEAD" if prev_tag and prev_tag != "HEAD" else "HEAD"
          log = subprocess.run(
              ["git", "log", "--pretty=format:%s", rng],
              capture_output=True, text=True).stdout.strip().split("\n")

          cats = {"feat": [], "fix": [], "docs": [], "other": []}
          for msg in log:
              if not msg:
                  continue
              m = re.match(r'^(feat|fix|docs?|refactor|ci|chore)(\(.*\))?:\s*(.*)$', msg)
              if m:
                  kind, _, rest = m.groups()
                  key = {"feat": "feat", "fix": "fix", "docs": "docs"}.get(kind, "other")
                  cats[key].append(rest.strip() or msg)
              else:
                  cats["other"].append(msg.strip())

          def section(icon, title, items):
              if not items:
                  return ""
              lines = "\n".join(f"- {i}" for i in items)
              return f"### {icon} {title}\n{lines}\n"

          header = "\n".join([
              f"## 📦 MeterStats v{version}",
              "",
              "> macOS 原生应用 · 通用二进制(Apple Silicon + Intel) · ad-hoc 本地签名",
              "",
              f"**安装**: 下载 `MeterStats-{version}-macos.dmg`,把 `MeterStats.app` 拖入「应用程序」。",
              "首次打开如被拦截(Apple 无法验证开发者),请 **右键点击应用 → 打开** 放行一次。",
              "",
          ])
          body = (
              header
              + section("✨", "新功能", cats["feat"])
              + section("🐛", "问题修复", cats["fix"])
              + section("📖", "文档", cats["docs"])
              + section("🔧", "其他改动", cats["other"])
          )
          print(body.rstrip())
          PYEOF
          )

          gh release create "$TAG" products/*.dmg \
            --target "$SHA" \
            --title "MeterStats v${VERSION}" \
            --notes "$NOTES"

          echo "✅ Release 已发布: https://github.com/zz3656/meter-stats/releases/tag/$TAG"
