name: Build DMG

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.DS_Store'
      - 'docs/**'
      - '.github/workflows/sync-readme-to-dockerhub.yml'
      - '.github/workflows/docker-publish.yml'
      - '.github/workflows/build-dmg.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.1),留空则用 MeterStats/VERSION'
        type: string
        default: ''

concurrency:
  group: dmg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-dmg:
    name: Build & Release DMG
    runs-on: macos-latest
    env:
      APP_NAME: "MeterStats"
      BUNDLE_ID: "com.meter.stats"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [[ "${{ github.event.inputs.version }}" != "" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(cat MeterStats/VERSION | tr -d ' \n\r')
          fi
          if [ -z "$VERSION" ]; then
            echo "❌ 无法确定版本号"
            exit 1
          fi
          echo "version=$VERSION" >> $GITHUB_ENV

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcode-select -p

      # ── 构建 .app ──────────────────────────────────────────
      - name: Build with Swift Package Manager
        run: |
          echo "${VERSION}" > MeterStats/VERSION
          find MeterStats -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true

          # 通用二进制(arm64 + x86_64),失败回退宿主架构
          swift build -c release --arch arm64 --arch x86_64 || swift build -c release

          APP_PATH="products/${APP_NAME}.app"
          rm -rf "$APP_PATH"
          mkdir -p "$APP_PATH/Contents/MacOS" "$APP_PATH/Contents/Resources"

          # 可执行文件(多架构在 apple/Products/Release/,单架构在 arm64-apple-macosx/release/)
          BIN=$(find .build -type f -path "*/Products/Release/${APP_NAME}" -perm -111 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then
            BIN=$(find .build -type f -path "*/release/${APP_NAME}" -perm -111 2>/dev/null | head -1)
          fi
          if [ -z "$BIN" ]; then
            echo "❌ 找不到编译产物 ${APP_NAME}"
            find .build -name "${APP_NAME}" -type f 2>/dev/null
            exit 1
          fi
          echo "✅ 编译产物: $BIN"
          file "$BIN"
          cp "$BIN" "$APP_PATH/Contents/MacOS/${APP_NAME}"

          # 资源(兼容扁平/嵌套两种 bundle 布局)
          BUNDLE_DIR=$(find .build -type d -name "*.bundle" 2>/dev/null | head -1)
          if [ -z "$BUNDLE_DIR" ]; then
            echo "❌ 找不到资源 bundle"
            exit 1
          fi
          RES_SRC="$BUNDLE_DIR"
          if [ -d "$BUNDLE_DIR/Contents/Resources" ]; then
            RES_SRC="$BUNDLE_DIR/Contents/Resources"
          fi
          echo "✅ 资源源目录: $RES_SRC"
          cp -R "$RES_SRC/." "$APP_PATH/Contents/Resources/"

          # Info.plist
          cp MeterStats/Info.plist "$APP_PATH/Contents/Info.plist"
          python3 - <<'PYEOF'
          import plistlib
          info_path = "products/MeterStats.app/Contents/Info.plist"
          with open(info_path, "rb") as f:
              info = plistlib.load(f)
          info["CFBundleExecutable"] = "MeterStats"
          with open(info_path, "wb") as f:
              plistlib.dump(info, f, sort_keys=False)
          PYEOF

          echo "✅ 已组装 .app"
          find "$APP_PATH" -type f | head -10

      # ── 图标 ────────────────────────────────────────────────
      - name: Embed AppIcon
        run: |
          APP="products/${APP_NAME}.app/Contents/Resources"
          mkdir -p "$APP"
          cp Assets/AppIcon.icns "$APP/AppIcon.icns"
          python3 - <<'PYEOF'
          import plistlib
          info_path = "products/MeterStats.app/Contents/Info.plist"
          with open(info_path, "rb") as f:
              info = plistlib.load(f)
          info["CFBundleIconFile"] = "AppIcon"
          info["CFBundleIconName"] = "AppIcon"
          with open(info_path, "wb") as f:
              plistlib.dump(info, f, sort_keys=False)
          PYEOF

      # ── 临时签名 ───────────────────────────────────────────
      - name: Ad-hoc sign
        run: |
          APP="products/${APP_NAME}.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ ad-hoc 签名完成"

      # ── 正式签名(有 Developer ID 才执行) ───────────────────
      - name: Install Apple Developer Certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ "$CERTIFICATE_BASE64" = "null" ]; then
            echo "⏭️ 未配置 APPLE_DEVELOPER_ID_CERTIFICATE，跳过证书安装"
            exit 0
          fi
          if [ -z "$CERTIFICATE_PASSWORD" ] || [ "$CERTIFICATE_PASSWORD" = "null" ]; then
            echo "❌ APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD 未配置"
            exit 1
          fi
          if [ -z "$KEYCHAIN_PASSWORD" ] || [ "$KEYCHAIN_PASSWORD" = "null" ]; then
            KEYCHAIN_PASSWORD="keychain-password"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          echo "$CERTIFICATE_BASE64" | base64 -d > certificate.p12
          security import certificate.p12 -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/altool
          rm certificate.p12

          security find-identity -v -p codesigning build.keychain

      - name: Sign app (Developer ID)
        env:
          TEAM_NAME: ${{ secrets.APPLE_DEVELOPER_ID_TEAM_NAME }}
        run: |
          if [ -z "$TEAM_NAME" ] || [ "$TEAM_NAME" = "null" ]; then
            echo "⏭️ 未配置 APPLE_DEVELOPER_ID_TEAM_NAME，跳过正式签名"
            exit 0
          fi
          APP="products/${APP_NAME}.app"
          SIGN_ID="Developer ID Application: $TEAM_NAME"
          echo "🔐 签名应用..."
          codesign --verbose=4 --sign "$SIGN_ID" --options runtime --timestamp \
            --entitlements "MeterStats/Linclub.entitlements" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          echo "✅ 正式签名完成"

      # ── 创建 DMG ───────────────────────────────────────────
      - name: Create DMG
        run: |
          APP="products/${APP_NAME}.app"
          DMG_NAME="${APP_NAME}-${VERSION}-macos.dmg"
          STAGING="/tmp/dmg-staging"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -r "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          hdiutil create -volname "${APP_NAME}" -srcfolder "$STAGING" \
            -ov -format UDZO -imagekey zlib-level=9 "$STAGING/$DMG_NAME"
          mv "$STAGING/$DMG_NAME" "products/$DMG_NAME"
          rm -rf "$STAGING"

          echo "✅ DMG 已创建: products/$DMG_NAME"
          ls -lh "products/$DMG_NAME"

      # ── 公证(有 Apple ID 才执行) ───────────────────────────
      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APP_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ "$APPLE_ID" = "null" ]; then
            echo "⏭️ 未配置 APPLE_NOTARIZATION_APPLE_ID，跳过公证"
            exit 0
          fi
          DMG="products/${APP_NAME}-${VERSION}-macos.dmg"
          echo "📤 提交公证..."
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" --password "$APP_PASSWORD" \
            --team-id "$TEAM_ID" --wait
          echo "✅ 公证成功!"

      - name: Staple notarization ticket
        env:
          APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
        run: |
          if [ -z "$APPLE_ID" ] || [ "$APPLE_ID" = "null" ]; then
            echo "⏭️ 未配置 APPLE_NOTARIZATION_APPLE_ID，跳过票据附加"
            exit 0
          fi
          APP="products/${APP_NAME}.app"
          DMG="products/${APP_NAME}-${VERSION}-macos.dmg"
          xcrun stapler staple "$APP" 2>&1 || echo "⚠️ 票据附加失败"
          xcrun stapler staple "$DMG" 2>&1 || echo "⚠️ 票据附加失败"

      # ── 验证 ───────────────────────────────────────────────
      - name: Verify
        run: |
          ls -lh products/
          codesign --verify --deep --strict "products/${APP_NAME}.app" || echo "⚠️ 签名验证有警告"

      # ── 上传产物 ───────────────────────────────────────────
      - name: Upload DMG as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "${APP_NAME}-${{ env.version }}"
          path: |
            products/*.dmg
          retention-days: 30

      # ── 发布 Release(覆盖式 latest) ────────────────────────
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.version }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          TAG="latest"
          echo "==> 发布 Release: $TAG (MeterStats v${VERSION}, commit ${SHA:0:7})"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "ℹ️ Release $TAG 已存在,删除后重建"
            gh release delete "$TAG" --yes --cleanup-tag || true
          fi

          # 生成结构化更新说明
          git fetch --prune --unshallow --tags origin 2>/dev/null || git fetch --tags origin 2>/dev/null || true
          NOTES=$(python3 << 'PYEOF'
          import re, subprocess, os

          version = os.environ["VERSION"]
          prev_tag = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", "HEAD~1"],
              capture_output=True, text=True).stdout.strip()
          if not prev_tag:
              prev_tag = subprocess.run(
                  ["git", "rev-list", "--max-parents=0", "HEAD"],
                  capture_output=True, text=True).stdout.strip()

          rng = f"{prev_tag}..HEAD" if prev_tag and prev_tag != "HEAD" else "HEAD"
          log = subprocess.run(
              ["git", "log", "--pretty=format:%s", rng],
              capture_output=True, text=True).stdout.strip().split("\n")

          cats = {"feat": [], "fix": [], "docs": [], "other": []}
          for msg in log:
              if not msg:
                  continue
              m = re.match(r'^(feat|fix|docs?|refactor|ci|chore)(\(.*\))?:\s*(.*)$', msg)
              if m:
                  kind, _, rest = m.groups()
                  key = {"feat": "feat", "fix": "fix", "docs": "docs"}.get(kind, "other")
                  cats[key].append(rest.strip() or msg)
              else:
                  cats["other"].append(msg.strip())

          def section(icon, title, items):
              if not items:
                  return ""
              lines = "\n".join(f"- {i}" for i in items)
              return f"### {icon} {title}\n{lines}\n"

          header = "\n".join([
              f"## 📦 MeterStats v{version}",
              "",
              "> macOS 原生应用 · 通用二进制(Apple Silicon + Intel) · ad-hoc 本地签名",
              "",
              f"**安装**: 下载 `MeterStats-{version}-macos.dmg`,把 `MeterStats.app` 拖入「应用程序」。",
              "首次打开如被拦截(Apple 无法验证开发者),请 **右键点击应用 → 打开** 放行一次。",
              "",
          ])
          body = (
              header
              + section("✨", "新功能", cats["feat"])
              + section("🐛", "问题修复", cats["fix"])
              + section("📖", "文档", cats["docs"])
              + section("🔧", "其他改动", cats["other"])
          )
          print(body.rstrip())

          PYEOF
          )

          gh release create "$TAG" products/*.dmg \
            --target "$SHA" \
            --title "MeterStats v${VERSION}" \
            --notes "$NOTES" \
            --latest

          echo "✅ Release 已发布: https://github.com/zz3656/meter-stats/releases/tag/$TAG"
