name: Sync README to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'README.Docker.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync README.Docker.md to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          echo "=================================================="
          echo " 同步 README.Docker.md 到 Docker Hub 仓库描述"
          echo "=================================================="
          echo ""
          echo "仓库: ${DOCKERHUB_USERNAME}/meter-stats"
          echo ""

          python3 << 'PYEOF'
          import json, os, urllib.request, urllib.error

          dockerhub_token = os.environ.get("DOCKERHUB_TOKEN", "")
          dockerhub_username = os.environ.get("DOCKERHUB_USERNAME", "")

          if not dockerhub_token or not dockerhub_username:
              print("❌ 未设置 DOCKERHUB_TOKEN / DOCKERHUB_USERNAME")
              exit(1)

          # 1. 读取 README.Docker.md(Docker Hub 专用,Docker 用户聚焦)
          readme_content = open("README.Docker.md", "r", encoding="utf-8").read()

          # 2. 提取简要描述（description 字段最多 100 字节）
          #    优先用 blockquote（它是给人看的一句话简介），没有再用一级标题。
          #    ⚠️ 旧实现里 `short_desc` 被每个 "# " 行反复覆盖，最终取的是 README
          #    里最后一个一级标题，而不是文档开头的简介 —— 所以 Docker Hub 上常年
          #    显示的是硬编码的 fallback 文案。
          lines = readme_content.strip().split("\n")
          heading = ""
          quote = ""
          for line in lines:
              line = line.strip()
              if line.startswith("# ") and not heading:
                  heading = line[2:].strip()
              elif line.startswith("> ") and not quote:
                  quote = line[2:].strip()
              if heading and quote:
                  break

          # blockquote 往往比标题长，截到第一个句号更像个"简介"
          if quote:
              for sep in ("。", "；", ". "):
                  idx = quote.find(sep)
                  if 0 < idx < 90:
                      quote = quote[: idx + len(sep)].rstrip()
                      break
              short_desc = quote
          else:
              short_desc = heading

          if not short_desc:
              short_desc = "工程部电表数据管理工具 · Docker 部署"

          # 确保不超过 100 字节
          short_desc = short_desc.encode("utf-8")[:100].decode("utf-8", errors="ignore")

          # 3. 清理 README 作为完整描述
          #    Docker Hub full_description 支持 Markdown
          clean_desc = readme_content

          # 4. 官方 JWT 登录(个人访问令牌作为密码;Basic 认证对写接口会 401)
          login_payload = json.dumps({"username": dockerhub_username, "password": dockerhub_token}).encode("utf-8")
          login_req = urllib.request.Request(
              "https://hub.docker.com/v2/users/login/",
              data=login_payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(login_req, timeout=30) as resp:
                  jwt = json.loads(resp.read().decode("utf-8"))["token"]
          except urllib.error.HTTPError as e:
              print(f"❌ Docker Hub 登录失败 (HTTP {e.code}): {e.read().decode()[:300]}")
              exit(1)

          data = {
              "description": short_desc,
              "full_description": clean_desc
          }

          payload = json.dumps(data, ensure_ascii=False).encode("utf-8")
          url = f"https://hub.docker.com/v2/repositories/{dockerhub_username}/meter-stats"

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Authorization": f"JWT {jwt}", "Content-Type": "application/json"},
              method="PATCH",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  code = resp.getcode()
                  result = json.loads(resp.read())
                  if code == 200:
                      print("✅ Docker Hub 仓库描述已更新！")
                      print(f"   简介: {result.get('description', '')}")
                      print(f"   详细介绍: {result.get('full_description', '')[:80]}...")
                      print(f"   访问: https://hub.docker.com/r/{dockerhub_username}/{result.get('name', 'meter-stats')}")
                  else:
                      print(f"⚠️ 意外状态码: {code}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"❌ 更新失败 (HTTP {e.code}): {body[:300]}")
              exit(1)
          except Exception as e:
              print(f"❌ 错误: {e}")
              exit(1)
          PYEOF
