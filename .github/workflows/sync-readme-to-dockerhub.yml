name: Sync README to Docker Hub

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync README to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: zz3656
        run: |
          echo "=================================================="
          echo " 同步 README.md 到 Docker Hub 仓库描述"
          echo "=================================================="
          echo ""
          echo "仓库: ${DOCKERHUB_USERNAME}/meter-stats"
          echo ""

          python3 << 'PYEOF'
          import json, os, base64, urllib.request, urllib.error

          dockerhub_token = os.environ.get("DOCKERHUB_TOKEN", "")
          dockerhub_username = os.environ.get("DOCKERHUB_USERNAME", "")

          if not dockerhub_token:
              print("❌ 未设置 DOCKERHUB_TOKEN")
              exit(1)

          # 1. 读取 README.md
          readme_content = open("README.md", "r", encoding="utf-8").read()

          # 2. 提取简要描述（description 字段最多 100 字节）
          #    取第一行标题 + 第二行 blockquote 作为简短描述
          lines = readme_content.strip().split("\n")
          short_desc = ""
          for line in lines:
              line = line.strip()
              if line.startswith("# "):
                  short_desc = line[2:].strip()
              elif line.startswith("> ") and not short_desc:
                  short_desc = line[2:].strip()
              elif short_desc and short_desc.startswith("# "):
                  # 如果第一行是标题，取第二行 blockquote
                  pass

          if not short_desc:
              short_desc = "场所工程部电表统计工具 · Web服务"

          # 确保不超过 100 字节
          short_desc = short_desc.encode("utf-8")[:100].decode("utf-8", errors="ignore")

          # 3. 清理 README 作为完整描述
          #    Docker Hub full_description 支持 Markdown
          #    去掉顶部的重复标题块，避免过长
          clean_desc = readme_content

          # 4. Docker Hub API 认证
          auth_str = f"{dockerhub_username}:{dockerhub_token}".encode("utf-8")
          auth_header = base64.b64encode(auth_str).decode("utf-8")

          data = {
              "description": short_desc,
              "full_description": clean_desc
          }

          payload = json.dumps(data, ensure_ascii=False).encode("utf-8")
          url = f"https://hub.docker.com/v2/repositories/{dockerhub_username}/meter-stats"

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Authorization": f"Basic {auth_header}", "Content-Type": "application/json"},
              method="PATCH",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  code = resp.getcode()
                  result = json.loads(resp.read())
                  if code == 200:
                      print("✅ Docker Hub 仓库描述已更新！")
                      print(f"   简介: {result.get('description', '')}")
                      print(f"   详细介绍: {result.get('full_description', '')[:80]}...")
                      print(f"   访问: https://hub.docker.com/r/{dockerhub_username}/{result.get('name', 'meter-stats')}")
                  else:
                      print(f"⚠️ 意外状态码: {code}")
          except urllib.error.HTTPError as e:
              body = e.read().decode()
              print(f"❌ 更新失败 (HTTP {e.code}): {body[:300]}")
              exit(1)
          except Exception as e:
              print(f"❌ 错误: {e}")
              exit(1)
          PYEOF
