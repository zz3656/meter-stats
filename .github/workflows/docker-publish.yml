name: Build and Push Docker Image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            zz3656/meter-stats:latest
            zz3656/meter-stats:v0.1.1

      - name: Update Docker Hub repository description
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: zz3656
          DOCKERHUB_SHORT_DESC: 场所工程部电表用量统计工具 — Web 服务。支持 linux/amd64 和 linux/arm64 多平台构建。
        run: |

          python3 << 'PYEOF'
          import json, os, urllib.request, base64

          short_desc = os.environ.get("DOCKERHUB_SHORT_DESC", "")
          full_description = open(".github/workflows/dockerhub-readme.md", "r", encoding="utf-8").read()
          dockerhub_username = os.environ.get("DOCKERHUB_USERNAME", "")
          dockerhub_token = os.environ.get("DOCKERHUB_TOKEN", "")

          data = {
              "full_description": full_description,
              "description": short_desc,
              "short_description": short_desc
          }

          payload = json.dumps(data, ensure_ascii=False).encode("utf-8")
          url = f"https://hub.docker.com/v2/repositories/{dockerhub_username}/meter-stats"
          auth_str = f"{dockerhub_username}:{dockerhub_token}".encode("utf-8")
          auth_header = base64.b64encode(auth_str).decode("utf-8")

          req = urllib.request.Request(
              url,
              data=payload,
              headers={"Authorization": f"Basic {auth_header}", "Content-Type": "application/json"},
              method="PATCH",
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  code = resp.getcode()
                  if code == 200 or code == 201:
                      print("✅ Docker Hub description updated!")
                      print(f"   https://hub.docker.com/r/{dockerhub_username}/meter-stats")
                  else:
                      print(f"⚠️ Unexpected status: {code}")
          except urllib.error.HTTPError as e:
              print(f"⚠️ HTTP Error {e.code}: {e.read().decode()}")
          except Exception as e:
              print(f"⚠️ Error: {e}")
          PYEOF
