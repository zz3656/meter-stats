name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-platform builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            zz3656/linclub-electricity-stats:latest
            zz3656/linclub-electricity-stats:v0.1.1

      - name: Update Docker Hub repository description
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          read -r -d '' FULL_DESC << 'READMEOF' || true
          $(cat .github/workflows/dockerhub-readme.md)
          READMEOF

          SHORT_DESC="林卡酒吧工程部电表用量统计工具 — Web 服务。支持 linux/amd64 和 linux/arm64 多平台构建。"

          FULL_DESC="$(cat .github/workflows/dockerhub-readme.md)"

          python3 -c "
          import json, sys
          short_desc = '''${SHORT_DESC}'''
          full_description = sys.stdin.read()
          data = json.dumps({
              'full_description': full_description,
              'description': short_desc,
              'short_description': short_desc
          }, ensure_ascii=False).encode('utf-8')

          import urllib.request
          url = 'https://hub.docker.com/v2/repositories/zz3656/linclub-electricity-stats'
          token = '${DOCKERHUB_TOKEN}'
          auth_header = 'Bearer ' + token

          req = urllib.request.Request(
              url,
              data=data,
              headers={'Authorization': auth_header, 'Content-Type': 'application/json'},
              method='PATCH',
          )
          with urllib.request.urlopen(req) as resp:
              code = resp.getcode()
              if code == 200 or code == 201:
                  print('✅ Docker Hub description updated!')
                  print('   https://hub.docker.com/r/zz3656/linclub-electricity-stats')
              else:
                  print(f'⚠️ Unexpected status: {code}')
          " << 'PYEOF'
          $(cat .github/workflows/dockerhub-readme.md)
          PYEOF
