# ============================================================
# 电表统计 — Docker Compose
# ============================================================
# 镜像: zz3656/meter-stats:latest
# 访问: http://localhost:8765
# 默认: admin / admin123
# 启动: docker compose up -d
# 停止: docker compose down
# ============================================================

services:
  meter-stats:
    image: zz3656/meter-stats:latest
    container_name: meter-stats
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 数据持久化（使用宿主机目录，重启容器数据不丢失）
      - ./data:/data
    environment:
      # 时区（POSIX 标准 TZ 环境变量，默认 Asia/Shanghai）
      - TZ=Asia/Shanghai
      # 服务端口（默认 8765）
      - METER_PORT=8765
      # 数据目录
      - METER_DATA_DIR=/data
      # 绑定地址（0.0.0.0 允许外部访问，默认值已在代码中设置）
      - METER_BIND=0.0.0.0
      # 初始管理员密码（⚠️ 请修改！）
      - METER_INITIAL_PASS=admin123
      # 备份目录(相对于数据目录,默认 backup)
      - METER_BACKUP_DIR=backup
      # 图片目录(相对于数据目录,默认 images)
      - METER_IMAGE_DIR=images
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
