# ============================================================
# 林卡电表统计 — Docker Compose 配置
# ============================================================
# 镜像: zz3656/linclub-electricity-stats:latest
# 访问: http://localhost:8765
# 默认: admin / admin123
# ============================================================

services:
  linclub:
    image: zz3656/linclub-electricity-stats:latest
    container_name: linclub
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - linclub-data:/data
    environment:
      - LINCLUB_PORT=8765
      - LINCLUB_DATA_DIR=/data
      - LINCLUB_BIND=0.0.0.0
      - LINCLUB_INITIAL_PASS=admin123  # ⚠️ 请修改！
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  linclub-data:
    driver: local
