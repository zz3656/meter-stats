# ============================================================
# 工程部管理系统 — Docker Compose(本地开发用)
# ============================================================
# 镜像: meter-stats:local(本地构建标签,不在 Docker Hub 上)
#       部署到 NAS / 服务器请用 docker/docker-compose.yml(zz3656/meter-stats:latest)
# 访问: http://localhost:8765
# 默认: admin / admin123
# 启动: docker compose up -d --build
# 停止: docker compose down
#
# ⚠️ 这个文件是**本地构建**用的,镜像只存在于本机:
#    `docker compose pull` 会去 Docker Hub 找 meter-stats:local 并失败。
#    要拉远端已发布镜像请改用 docker/docker-compose.yml,
#    或直接 bash scripts/docker-update.sh
# ============================================================

services:
  meter-stats:
    image: meter-stats:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BUILD_ID: local
    container_name: meter-stats
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # 数据持久化（使用绝对路径，防止 docker-compose.yml 目录变化导致数据丢失）
      # NAS 用户请改为实际路径，如 /vol1/1000/docker/linclub/data:/data
      - ./data:/data
    environment:
      # 时区（POSIX 标准 TZ 环境变量，默认 Asia/Shanghai）
      - TZ=Asia/Shanghai
      # 服务端口（默认 8765）
      - METER_PORT=8765
      # 数据目录
      - METER_DATA_DIR=/data
      # 标记 Docker 环境：锁定备份/图片目录的 UI 编辑（由下面的环境变量控制）
      - METER_DOCKER=1
      # 绑定地址（0.0.0.0 允许外部访问，默认值已在代码中设置）
      - METER_BIND=0.0.0.0
      # 初始管理员密码（⚠️ 请修改！）
      - METER_INITIAL_PASS=admin123
      # 备份目录(相对于数据目录,默认 backup)
      - METER_BACKUP_DIR=backup
      # 图片目录(相对于数据目录,默认 images)
      - METER_IMAGE_DIR=images
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
