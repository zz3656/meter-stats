# ============================================================
# 林卡电表统计 — Docker Compose（根目录快捷入口）
# ============================================================
# 启动:  docker compose up -d
# 停止:  docker compose down
# 日志:  docker compose logs -f
# ============================================================

services:
  linclub:
    build:
      context: ./docker
      dockerfile: Dockerfile
    container_name: linclub
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - linclub-data:/data
    environment:
      - LINCLUB_PORT=8765
      - LINCLUB_DATA_DIR=/data
      - LINCLUB_BIND=0.0.0.0
      # ⚠️ 请修改默认密码！
      - LINCLUB_INITIAL_PASS=admin123
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  linclub-data:
    driver: local
