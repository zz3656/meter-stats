<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1b2e"/>
      <stop offset="100%" stop-color="#0f1020"/>
    </linearGradient>
    <!-- 闪电渐变 -->
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7170ff"/>
      <stop offset="100%" stop-color="#5e6ad2"/>
    </linearGradient>
    <!-- 圆角矩形 clip -->
    <clipPath id="rc">
      <rect x="10.0" y="10.0" width="80.0" height="80.0" rx="22.3" ry="22.3"/>
    </clipPath>
  </defs>
  <!-- 背景 -->
  <g clip-path="url(#rc)">
    <rect x="0" y="0" width="100" height="100" fill="url(#bg)"/>
  </g>
  <!-- 闪电 -->
  <polygon points="50,15.3 64.4,29.6 45.2,29.6 47.6,64.7 35.6,41.3 54.8,41.3" fill="url(#bolt)" clip-path="url(#rc)"/>
  <!-- 柱状图 -->
  <g clip-path="url(#rc)">
    <rect x="21.5" y="77" width="13" height="10" rx="2.5" fill="#60a5fa"/>
    <rect x="37.5" y="70" width="13" height="17" rx="2.5" fill="#f87171"/>
    <rect x="53.5" y="63" width="13" height="24" rx="2.5" fill="#4ade80"/>
    <rect x="69.5" y="56" width="13" height="31" rx="2.5" fill="#fbbf24"/>
  </g>
</svg>